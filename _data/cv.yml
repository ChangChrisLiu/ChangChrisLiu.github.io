- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Texas A&M University, Control and Robotics Lab
      year: Jan. 2024 - Present
      description:
        - title: Robotic Disassembly for End-of-Life Products
          contents:
            - "Implemented perception and disassembly sequence planning for various EoL desktops on UR5e using YOLO, GNN, and VLM"
            - "Built and open-sourced a GELLO-based teleoperation platform with ZMQ robot control, dual-camera capture, phase-labeled recording, and dataset export for OpenVLA, OpenVLA-OFT, and openpi"
            - "Developed annotation software and contributed to a team multimodal dataset of end-of-life desktop computers; dataset work is ongoing"
            - "Developed PACER (CoRL 2026): VLA post-training through native SFT using robot rollouts, human corrections, and clean demonstrations"
            - "PACER achieved 87/100 successful approach-and-handoff trials versus 54/100 for vanilla post-SFT on a held-out UR5e benchmark across five component classes"
            - "Developed SELF-VLA, coordinating learned approach and recovery policies with explicit disassembly and placement skills"
        - title: RAISE - Robot-Assisted Sorting for EoL Phones
          contents:
            - "Designed and built a UR5e sorting station with Idaho National Laboratory, integrating hand-eye calibration, YOLOv8 instance segmentation, and automated sorting"
        - title: Additional Contributions
          contents:
            - "Developed a separate dual-joystick teleoperation system"
            - "Developed real-time disassembly sequence planning using GNN and VLM for robotic e-waste disassembly"
            - "Contributed to precision 3D scanning of computer enclosures using high dynamic range fringe projection (published in Applied Optics)"
    - title: Graduate Research Assistant
      institution: University at Buffalo, SUNY, CAL-UB Lab
      year: Aug. 2019 - Feb. 2021
      description:
        - "Developed a vision-only ConvLSTM model for robot and obstacle state prediction and stop-go collision avoidance without access to robot dynamics"
